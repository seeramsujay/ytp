<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0c"/>
      <stop offset="100%" stop-color="#241115"/>
    </linearGradient>
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#ff0000" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Playlist Stack Geometry -->
  <rect x="140" y="90" width="220" height="45" rx="12" fill="#2d1318" stroke="#ff0055" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="115" y="125" width="270" height="55" rx="14" fill="#3a161d" stroke="#ff0055" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Main Media Screen Frame -->
  <rect x="90" y="170" width="320" height="230" rx="28" fill="#1f0c11" stroke="url(#ytRed)" stroke-width="5" filter="url(#glow)"/>

  <!-- Accelerated Download Chevron / Arrow -->
  <path d="M 250 215 L 250 315 M 210 275 L 250 315 L 290 275" fill="none" stroke="url(#speedGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Horizontal Aria2 Multi-Connection Buffer Tracks -->
  <line x1="160" y1="345" x2="340" y2="345" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
  <circle cx="210" cy="345" r="4" fill="#ffffff"/>
  <circle cx="270" cy="345" r="4" fill="#ffffff"/>

  <!-- YouTube Play Triangle Accent in Corner -->
  <polygon points="125,200 125,220 142,210" fill="#ff0000"/>
</svg>
